<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="応用情報">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>応用情報 学習管理</title>
<style>
:root{
  --bg:#f5f4f0;--card:#fff;--ink:#1c1c1e;--sub:#6e6e73;--faint:#9a9aa0;--line:#e5e3dc;
  --accent:#2563d9;--accent-ink:#fff;--accent-weak:#e9f0fc;
  --subtrack:#7448c9;--subtrack-weak:#f1ebfb;
  --good:#1e8a4a;--good-weak:#e4f3e9;--warn:#ad6600;--warn-weak:#fbf0dc;--bad:#c4372b;--bad-weak:#fbe8e6;
  --radius:14px;--tabh:56px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111214;--card:#1c1d20;--ink:#f2f2f4;--sub:#a1a1a8;--faint:#76767d;--line:#2e2f34;
    --accent:#6f9fff;--accent-ink:#0b1730;--accent-weak:#1b2640;
    --subtrack:#b597ff;--subtrack-weak:#2a2140;
    --good:#4cc27c;--good-weak:#15301f;--warn:#e9a640;--warn-weak:#33270f;--bad:#ff7d71;--bad-weak:#3a1a17;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 16px)}
body.setup{padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#topbar{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 12px) 18px 8px}
#topbar h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.01em}
#topbar .date{font-size:14px;color:var(--sub);font-weight:500}
.syncstat{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 12px);border:0;background:transparent;font-size:12px;font-weight:600;color:var(--good);padding:4px 6px;border-radius:8px}
.syncstat.syncing{color:var(--sub)}.syncstat.error{color:var(--bad)}.syncstat.offline{color:var(--warn)}
main{padding:4px 14px 8px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin:0 0 12px;border:1px solid var(--line)}
.card h2{font-size:15px;margin:0 0 10px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:8px}
.card h2 .tag.right{margin-left:auto}
a{color:var(--accent)}
.muted{color:var(--sub)}
.small{font-size:13px}
.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-weak);color:var(--accent);white-space:nowrap}
.tag.sub{background:var(--subtrack-weak);color:var(--subtrack)}
.tag.good{background:var(--good-weak);color:var(--good)}
.tag.warn{background:var(--warn-weak);color:var(--warn)}
.tag.bad{background:var(--bad-weak);color:var(--bad)}
.tag.plain{background:transparent;border:1px solid var(--line);color:var(--sub)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.subbar>i{background:var(--subtrack)}
.count{display:flex;gap:10px}
.count>div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.count .lbl{font-size:12px;color:var(--sub);font-weight:600}
.count .num{font-size:26px;font-weight:700;line-height:1.2}
.count .num small{font-size:13px;font-weight:600;color:var(--sub);margin-left:2px}
.count .when{font-size:12px;color:var(--faint)}
.status{font-size:14px;font-weight:600}
.status.good{color:var(--good)}.status.warn{color:var(--warn)}.status.bad{color:var(--bad)}
.task-title{font-size:20px;font-weight:700;line-height:1.3;margin:2px 0}
.task-sub{font-size:14px;color:var(--sub)}
.seclist{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.seclist li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.seclist li:last-child{border-bottom:0}
.seclist .sid{font-variant-numeric:tabular-nums;color:var(--sub);min-width:34px;font-weight:600}
.seclist .stitle{flex:1}
.seclist .note{font-size:12px;color:var(--faint);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.subc{background:var(--subtrack);border-color:var(--subtrack);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:8px;margin-top:12px}
.btns>.btn{flex:1}
.banner{border-radius:var(--radius);padding:12px 14px;margin:0 0 12px;font-size:14px;display:flex;gap:10px;align-items:center}
.banner.warn{background:var(--warn-weak);color:var(--warn)}
.banner.info{background:var(--accent-weak);color:var(--accent)}
.banner .btn{min-height:34px;padding:0 12px;font-size:13px;margin-left:auto;flex:none}
.rv{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:0;padding-bottom:0}
.rv:first-of-type{padding-top:0}
.rv .t{flex:1;font-size:15px}
.rv .d{font-size:12px;color:var(--sub)}
.rv .d.late{color:var(--bad);font-weight:600}
.chapter{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:0 0 10px;overflow:hidden}
.ch-head{display:flex;gap:12px;align-items:center;padding:14px 16px 10px;width:100%;background:none;border:0;text-align:left}
.ch-no{width:30px;height:30px;border-radius:9px;background:var(--accent-weak);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:15px}
.ch-no.sub{background:var(--subtrack-weak);color:var(--subtrack)}
.ch-title{flex:1;font-weight:600;line-height:1.35}
.ch-title small{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:2px}
.ch-pct{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.chapter .bar{margin:0 16px 12px}
.secs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.secs li{border-bottom:1px solid var(--line)}
.secs li:last-child{border-bottom:0}
.secs button{display:flex;gap:10px;align-items:center;width:100%;padding:11px 16px;background:none;border:0;text-align:left;font-size:15px}
.secs .sid{font-variant-numeric:tabular-nums;color:var(--sub);min-width:36px;font-weight:600;font-size:14px}
.secs .stitle{flex:1;line-height:1.35}
.secs .pg{font-size:12px;color:var(--faint);white-space:nowrap}
.mark{min-width:28px;text-align:center;font-weight:700;font-size:16px}
.m3{color:var(--good)}.m2{color:var(--accent)}.m1{color:var(--warn)}.mp{font-size:11px;color:var(--sub);font-weight:600}
.weeks{display:flex;align-items:flex-end;gap:6px;height:120px;margin:8px 0 4px;position:relative}
.weeks .w{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.weeks .w i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.weeks .w.cur i{background:var(--accent)}
.weeks .w:not(.cur) i{opacity:.55}
.weeks .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--faint)}
.wlabels{display:flex;gap:6px}
.wlabels span{flex:1;text-align:center;font-size:11px;color:var(--faint)}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv>span:first-child{flex:none;margin-right:14px;color:var(--sub)}
.kv>span:last-child{text-align:right}
.loglist{list-style:none;margin:0;padding:0}
.loglist li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.loglist li:last-child{border-bottom:0}
.loglist .ld{color:var(--sub);font-size:12px;min-width:74px}
.loglist .lt{flex:1}
.loglist .lm{font-weight:600;font-variant-numeric:tabular-nums}
.x{width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:var(--faint);font-size:18px;line-height:1}
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;font-size:13px;color:var(--sub);font-weight:600;margin-bottom:4px}
input[type=number],input[type=date],input[type=text],input[type=password],select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pgrid{display:grid;grid-template-columns:1fr 96px;gap:8px 10px;align-items:center}
.pgrid .pl{font-size:14px;line-height:1.3}
.pgrid .pl small{display:block;color:var(--faint);font-size:12px}
.pgrid input{min-height:40px;padding:8px 10px;text-align:right}
.pgrid select{min-height:40px;padding:6px 8px}
details{margin-top:12px}
details summary{font-size:14px;color:var(--accent);font-weight:600;padding:6px 0;cursor:pointer}
details .pgrid{margin:8px 0 12px}
.err{color:var(--bad);font-size:14px;font-weight:600;margin:8px 0 0}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border:0;background:transparent;border-radius:9px;font-weight:600;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.under{display:flex;gap:6px}
.under button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.under button small{font-weight:500;font-size:11px;display:block;color:var(--sub);line-height:1.1}
.under button.on.u3{background:var(--good-weak);border-color:var(--good);color:var(--good)}
.under button.on.u2{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
.under button.on.u1{background:var(--warn-weak);border-color:var(--warn);color:var(--warn)}
.urow{padding:10px 0;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.urow .ut{font-size:14px;margin-bottom:6px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:16px;font-weight:700;flex:none}
.stepper input{text-align:center;font-weight:700;font-size:18px}
.stepper .unit{flex:none;color:var(--sub);font-size:14px}
.checks label{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:15px}
.checks input{width:20px;height:20px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;height:var(--tabh);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--faint)}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--accent)}
body.setup #tabs{display:none}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;opacity:0;transition:opacity .2s}
#backdrop.show{opacity:1}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:18px 18px 0 0;
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 18px calc(env(safe-area-inset-bottom) + 18px);
  transform:translateY(100%);transition:transform .22s ease-out;max-width:600px;margin:0 auto}
#sheet.show{transform:translateY(0)}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
#sheet h3{margin:0 0 4px;font-size:19px}
#sheet .lead{color:var(--sub);font-size:14px;margin:0 0 14px}
#sheet .sec{margin:16px 0 0}
#sheet .sec>.lbl{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:6px}
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);z-index:30;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:90vw;box-shadow:0 4px 18px rgba(0,0,0,.2)}
.setup-wrap{padding:calc(env(safe-area-inset-top) + 28px) 18px 0;max-width:560px;margin:0 auto}
.setup-wrap h1{font-size:26px;margin:0 0 8px}
.setup-wrap .steps{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:6px}
.setup-wrap p{color:var(--sub);margin:0 0 14px;font-size:15px}
.setup-wrap ul{padding-left:20px;margin:0 0 16px;color:var(--ink);font-size:15px}
.setup-wrap li{margin-bottom:6px}
.empty{color:var(--sub);font-size:14px}
.pill-good{color:var(--good);font-weight:700}.pill-warn{color:var(--warn);font-weight:700}.pill-bad{color:var(--bad);font-weight:700}
</style>
</head>
<body>
<header id="topbar"></header>
<main id="view"></main>
<nav id="tabs">
  <button data-action="tab" data-tab="today" aria-label="今日"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 14.5l2 2 4-4"/></svg>今日</button>

  <button data-action="tab" data-tab="log" aria-label="記録"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><rect x="5.5" y="11" width="3" height="6" rx="1"/><rect x="10.5" y="7" width="3" height="10" rx="1"/><rect x="15.5" y="4" width="3" height="13" rx="1"/></svg>記録</button>
  <button data-action="tab" data-tab="settings" aria-label="設定"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定</button>
</nav>
<div id="backdrop" hidden></div>
<div id="sheet" hidden role="dialog" aria-modal="true"></div>
<div id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
const APP_VERSION = '1.2.0';

/* ========== 教本マスタ（令和08年 応用情報技術者 合格教本） ========== */
const CHAPTERS = [
  {no:1, title:'基礎理論', track:'main', sections:['集合と論理','情報量と符号化','オートマトン','形式言語','グラフ理論','確率と統計','回帰分析','数値計算','AI（人工知能）']},
  {no:2, title:'アルゴリズムとプログラミング', track:'main', sections:['リスト','スタックとキュー','木構造','探索アルゴリズム','整列アルゴリズム','再帰法','プログラム言語']},
  {no:3, title:'ハードウェアとコンピュータ構成要素', track:'main', sections:['ハードウェア','プロセッサアーキテクチャ','プロセッサの高速化技術','メモリアーキテクチャ','入出力アーキテクチャ']},
  {no:4, title:'システム構成要素', track:'main', sections:['システムの処理形態','クライアントサーバシステム','システムの構成と信頼性設計','高信頼性・高性能システム','ストレージ関連技術','仮想化技術','システムの性能特性と評価','待ち行列理論の適用']},
  {no:5, title:'ソフトウェア', track:'main', sections:['OSの構成と機能','タスク（プロセス）管理','記憶管理','言語処理ツール','開発ツール','UNIX系OS']},
  {no:6, title:'データベース', track:'main', sections:['データベース設計','関係データベース','正規化','関係データベースの演算','SQL','データ定義言語','埋込み方式','データベース管理システム','分散データベース','データベース応用','ブロックチェーン']},
  {no:7, title:'ネットワーク', track:'main', sections:['通信プロトコルの標準化','ネットワーク接続装置と関連技術','データリンク層の制御とプロトコル','ネットワーク層のプロトコルと技術','トランスポート層のプロトコル','アプリケーション層のプロトコル','ネットワークの仮想化技術','無線LAN','通信規格・通信技術']},
  {no:8, title:'セキュリティ', track:'main', sections:['暗号化','無線LANの暗号','認証','デジタル署名とPKI','セキュリティ実装技術','情報セキュリティの脅威と攻撃手法','情報セキュリティ管理']},
  {no:9, title:'システム開発技術', track:'main', sections:['開発プロセス・手法','分析・設計手法','オブジェクト指向設計','モジュール設計','テスト','テスト管理手法','レビュー']},
  {no:10, title:'マネジメント', track:'sub', sections:['プロジェクトマネジメント','スケジュールマネジメントで用いる手法','コストマネジメントで用いる手法','サービスマネジメント','システム監査']},
  {no:11, title:'ストラテジ', track:'sub', sections:['システム戦略','経営戦略マネジメント','ビジネスインダストリ','経営工学','企業会計','標準化と関連法規']},
];
const SECTIONS = [];
CHAPTERS.forEach(c => c.sections.forEach((t, i) => SECTIONS.push({id:`${c.no}.${i + 1}`, ch:c.no, idx:i, title:t, track:c.track})));
const SEC = Object.fromEntries(SECTIONS.map(s => [s.id, s]));
const CH = Object.fromEntries(CHAPTERS.map(c => [c.no, c]));
const TRACKS = {
  main:{name:'メイン', range:'1〜9章', desc:'テクノロジ系', defMin:90},

/* ========== ページ配置 ========== */
function pagesComplete(s) {

function buildLayout(s, weights) {

  const secs = {};
  CHAPTERS.forEach((c, ci) => {
    const n = c.sections.length;
    if (mode === 'virtual') {
      c.sections.forEach((_, i) => { secs[`${c.no}.${i + 1}`] = {p1:null, p2:null, len:VIRTUAL_LEN}; });
      return;
    }
    const cs = s.chapterStart[ci];
    const ceNext = ci < 10 ? s.chapterStart[ci + 1] : s.bodyEnd + 1; // 次の章の開始（＝この章の終わり+1）
    // 節の開始ページ：入力があればそれを使い、無い所は前後の値から均等に補う
    const anchors = c.sections.map((_, i) => { const v = s.sectionStart[`${c.no}.${i + 1}`]; return isInt(v) ? v : null; });
    anchors[0] = cs;
    let st = anchors.slice();
    const known = [];
    st.forEach((v, i) => { if (v !== null) known.push(i); });
    known.push(n); // 番兵：章の終わり
    const valAt = i => i === n ? ceNext : st[i];
    for (let k = 0; k < known.length - 1; k++) {
      const a = known[k], b = known[k + 1], va = valAt(a), vb = valAt(b);
      for (let i = a + 1; i < b; i++) st[i] = Math.round(va + (vb - va) * (i - a) / (b - a));
    }
    // 単調でなければ均等割りに戻す
    let ok = true;
    for (let i = 0; i < n; i++) { const nx = i < n - 1 ? st[i + 1] : ceNext; if (!(nx > st[i])) ok = false; }
    if (!ok) st = c.sections.map((_, i) => Math.round(cs + (ceNext - cs) * i / n));
    c.sections.forEach((_, i) => {
      const p1 = st[i], p2 = (i < n - 1 ? st[i + 1] : ceNext) - 1;
      secs[`${c.no}.${i + 1}`] = {p1, p2, len:Math.max(1, p2 - p1 + 1)};

  const W = weights || {};
  const track = {}, wOf = {};
  for (const tr of ['main', 'sub']) {
    let off = 0, pages = 0;
    const list = SECTIONS.filter(x => x.track === tr).map(x => {
      const L = secs[x.id].len, w = W[x.ch] || 1;
      wOf[x.id] = w;
      const o = {id:x.id, start:r2(off), end:r2(off + L * w), w, len:L};

const pagesText = n => layout.mode === 'pages' ? `${Math.round(n)}ページ` : `${fmt1(n / VIRTUAL_LEN)}節`;
const daysText = d => `約${fmt1(d)}日分`;

/* ========== 進捗 ========== */
const prog = id => state.progress[id];
const isDone = id => prog(id).frac >= 1;
const readPages = id => isDone(id) ? layout.secs[id].len : Math.round(clamp(prog(id).frac, 0, 1) * layout.secs[id].len);
const trackDone = tr => r2(layout.track[tr].list.reduce((a, x) => a + readPages(x.id) * x.w, 0)); // 重み付き
const trackPagesLeft = tr => layout.track[tr].list.reduce((a, x) => a + layout.secs[x.id].len - readPages(x.id), 0);

const chapterDone = no => CH[no].sections.every((_, i) => isDone(`${no}.${i + 1}`));

/* ========== 重さ（章ごとの読みやすさ）と実績による補正 ========== */
const priorWeights = () => Object.fromEntries(CHAPTERS.map(c => [c.no, LEVELS[state.settings.chapterLevel[c.no]] || 1]));
const planWeights = () => (state.plan && state.plan.weights) || priorWeights();
// 記録した時間を、そのとき読んだ節に割り振って、章ごとの「ページ数・分数」を集める
function timeStats() {
  const prior = priorWeights();
  const obs = {};
  CHAPTERS.forEach(c => { obs[c.no] = {pages:0, minutes:0}; });
  for (const l of state.logs) {
    if (!l.pages || !(l.minutes > 0)) continue;
    const ents = Object.entries(l.pages).filter(([id, n]) => SEC[id] && n > 0);
    const W = ents.reduce((a, [id, n]) => a + prior[SEC[id].ch] * n, 0);
    if (!(W > 0)) continue;
    for (const [id, n] of ents) { const ch = SEC[id].ch; obs[ch].pages += n; obs[ch].minutes += l.minutes * prior[ch] * n / W; }
  }
  const totP = Object.values(obs).reduce((a, o) => a + o.pages, 0);
  const totWP = CHAPTERS.reduce((a, c) => a + prior[c.no] * obs[c.no].pages, 0);
  const totM = Object.values(obs).reduce((a, o) => a + o.minutes, 0);
  const k = totWP > 0 ? totM / totWP : 0; // 重さ1.0のページ1枚にかかる分数

}
// 実績で補正した重さ。同じ目安（速め・標準・丁寧）の章どうしは、読んだ章の実績をまだ読んでいない章にも反映する
function effectiveWeights() {
  const {prior, obs, k, enough} = timeStats();
  const w = {...prior}, P0 = 30, MIN = 5;
  if (!enough) return {w, prior, obs, k:0};
  const ratio = {};
  CHAPTERS.forEach(c => { const o = obs[c.no]; if (o.pages >= MIN) ratio[c.no] = (o.minutes / o.pages) / (k * prior[c.no]); });
  const g = {};
  for (const lv of Object.keys(LEVELS)) {
    const chs = CHAPTERS.filter(c => state.settings.chapterLevel[c.no] === lv && ratio[c.no] !== undefined);
    const num = chs.reduce((a, c) => a + ratio[c.no] * obs[c.no].pages, 0), den = chs.reduce((a, c) => a + obs[c.no].pages, 0);
    g[lv] = (num + P0) / (den + P0);
  }
  CHAPTERS.forEach(c => {
    const gl = g[state.settings.chapterLevel[c.no]] ?? 1, o = obs[c.no];
    const f = ratio[c.no] !== undefined ? (ratio[c.no] * o.pages + gl * P0) / (o.pages + P0) : gl;
    w[c.no] = r2(clamp(prior[c.no] * f, 0.4, 2.5));

}

/* ========== 計画 ========== */
function planDays(from, to, adjustWd) {

  for (let d = from; d <= to; d = addDays(d, 1)) if (parseD(d).getDay() !== adjustWd) out.push(d);
  return out;
}
// 区切りが節の途中に来たとき：残りが少なければ節の終わりまで、読み始めが少しだけなら節の手前で止める
function snapOffset(tr, c, prev) {
  const sec = layout.track[tr].list.find(x => c > x.start + EPS && c < x.end - EPS);
  if (!sec) return c;
  const lim = layout.mode === 'virtual' ? (sec.end - sec.start) / 2 : SNAP * sec.w;
  if (sec.end - c <= lim + EPS) return sec.end;
  if (c - sec.start <= lim + EPS && (sec.start > prev + EPS || layout.mode === 'virtual')) return sec.start;
  return c;
}
function makePlan(from, to, base) {

  for (const tr of ['main', 'sub']) {

// 当初のペース（開始日〜最初に決めた目標日）。組み直しの「1.3倍」や先行・遅れの日数の基準
function origPace(L = layout) {

// mode: 'baseline' = 開始日から作り直す / 'fromToday' = 今日から組み直す。どちらも実績で補正した重さを使う

}

  if (t < p.from) return {target:p.base[tr] || 0, kind:'before'};
  if (t > p.to) {

const nz = v => v < 0.05 ? 0 : v;

// 先頭の未読から need（重み付き）分を集める。節の残りが少なければ読み切る

  const readToday = state.readLog.some(e => e.date === t && e.pages > 0 && isTr(e));
  const end = readToday ? t : addDays(t, -1);
  const ws = s.startDate > addDays(end, -6) ? s.startDate : addDays(end, -6);
  const days = diffDays(ws, end) + 1;
  if (days < 3) return null;
  const ents = state.readLog.filter(e => e.date >= ws && e.date <= end && isTr(e));
  const readDays = new Set(ents.filter(e => e.pages > 0).map(e => e.date)).size;

function renderLog(t) {

  for (let i = 7; i >= 0; i--) { const a = addDays(ws, -7 * i); weeks.push({a, m:minutesBetween(a, addDays(a, 6))}); }
  const max = Math.max(goal, ...weeks.map(w => w.m), 60);
  const byCat = {};
  state.logs.filter(l => l.date >= ws && l.date <= addDays(ws, 6)).forEach(l => { byCat[l.cat] = (byCat[l.cat] || 0) + l.minutes; });
  let h = `<div class="card"><h2>今週の学習時間<span class="tag plain right">目標 ${hm(goal)}</span></h2>

    <div class="btns"><button class="btn" data-action="add-log">時間を記録</button></div></div>`;
  // 過去問
  const ex = state.exams.slice().sort((a, b) => b.date.localeCompare(a.date));
  h += `<div class="card"><h2>過去問の結果</h2>${ex.length ? `<ul class="loglist">${ex.map(e => {

  }).join('')}</ul>` : '<div class="empty">まだ記録がありません。教本1周の後（フェーズ2）から本格的に使います。</div>'}
    <div class="btns"><button class="btn" data-action="add-exam" data-kind="am">午前を記録</button><button class="btn" data-action="add-exam" data-kind="pm">午後を記録</button></div></div>`;

function readPagesForm(prefix) {
  const num = id => { const el = document.getElementById(id); if (!el) return null; const v = el.value.trim(); return v === '' ? null : Number(v); };
  const cs = CHAPTERS.map(c => num(`${prefix}cs${c.no}`));
  const end = num(`${prefix}end`);
  const filled = cs.filter(v => v !== null).length + (end !== null ? 1 : 0);
  if (filled === 0) return {ok:true, chapterStart:Array(11).fill(null), bodyEnd:null, sectionStart:{}, empty:true};
  if (filled < 12 || ![...cs, end].every(isInt)) return {ok:false, error:'11章すべての開始ページと、本文の最終ページを整数で入れてください。'};
  for (let i = 1; i < 11; i++) if (!(cs[i] > cs[i - 1])) return {ok:false, error:`${i + 1}章の開始ページが${i}章より前になっています。`};
  if (!(end >= cs[10])) return {ok:false, error:'本文の最終ページが11章の開始ページより前になっています。'};
  const ss = {};
  for (const c of CHAPTERS) {
    const ci = c.no - 1, lo = cs[ci], hi = ci < 10 ? cs[ci + 1] - 1 : end;
    let prev = lo;
    for (let i = 1; i < c.sections.length; i++) {
      const id = `${c.no}.${i + 1}`, v = num(`${prefix}ss${id.replace('.', '_')}`);
      if (v === null) continue;
      if (!isInt(v) || v <= prev || v > hi) return {ok:false, error:`${id} の開始ページが、${c.no}章の範囲（p.${lo}–${hi}）か前の節との順番に合っていません。`};
      ss[id] = v; prev = v;
    }
  }
  return {ok:true, chapterStart:cs, bodyEnd:end, sectionStart:ss};
}

function openComplete(tr, mode) {
  const t = today(), st = trackStatus(tr, t);
  const need = mode === 'today' ? todayNeed(st).need : chunkSize(tr);
  const items = buildRange(tr, need);
  if (!items.length) return;
  ui.sheet = {kind:'complete', tr, items, partial:false, page:null, checks:items.map(() => true), u:{}, minutes:state.meta.lastMinutes[tr] ?? TRACKS[tr].defMin};
  openSheet(completeHTML());
}
function willComplete() {
  const sh = ui.sheet;
  return sh.items.filter((it, i) => {
    if (it.to < it.len) return false;
    if (!sh.partial) return true;
    if (layout.mode === 'pages') { const P = sh.page; return P !== null && P >= layout.secs[it.id].p2; }
    return sh.checks[i];
  }).map(it => it.id);
}
function completeHTML() {
  const sh = ui.sheet, T = TRACKS[sh.tr];
  const fin = willComplete();
  let partial = '';
  if (sh.partial) {
    if (layout.mode === 'pages') {
      const a = sh.items[0], b = sh.items[sh.items.length - 1];

    } else {

    }
  }
  const under = fin.length ? `<div class="sec"><div class="lbl">読み終えた節の理解度</div>${fin.map(id => `<div class="urow"><div class="ut">${id} ${esc(SEC[id].title)}</div>${underButtons(sh.u[id] ?? 2, 'cs-u', `data-id="${id}"`)}</div>`).join('')}
    <div class="tiny muted" style="margin-top:6px">△にした節は3日後に読み直しが入ります。</div></div>` : '';
  return `<h3>${T.name}を記録</h3><p class="lead">${esc(rangeTitle(sh.items))}　${rangeSub(sh.items)}</p>
    <div class="seg"><button class="${sh.partial ? '' : 'on'}" data-action="cs-partial" data-v="0">全部読んだ</button><button class="${sh.partial ? 'on' : ''}" data-action="cs-partial" data-v="1">途中まで</button></div>
    ${partial}${under}
    <div class="sec"><div class="lbl">勉強した時間</div>${stepper('cs-min', sh.minutes, 10, '分', 0, 600)}</div>
    <div class="btns"><button class="btn ghost" data-action="close">やめる</button><button class="btn ${sh.tr === 'sub' ? 'subc' : 'primary'}" data-action="cs-save">記録する</button></div>`;
}
function saveComplete() {
  const sh = ui.sheet, t = today();
  sh.minutes = Number($('#cs-min').value) || 0;
  if (sh.partial && layout.mode === 'pages') {
    const v = $('#cs-page').value.trim();
    if (v === '') { toast('読み終えたページを入れてください'); return; }
    sh.page = Number(v);
  }
  const newly = [], delta = {};
  sh.items.forEach((it, i) => {
    const before = readPages(it.id);
    let reach = it.to;
    if (sh.partial) {
      if (layout.mode === 'pages') reach = clamp(sh.page - layout.secs[it.id].p1 + 1, it.from, it.to);
      else reach = sh.checks[i] ? it.to : it.from;
    }
    const p = prog(it.id), was = p.frac >= 1;
    const nf = Math.max(p.frac, reach / it.len);
    p.frac = nf >= 0.9999 ? 1 : nf; p.tf = nowMs();
    if (!was && p.frac >= 1) { p.u = sh.u[it.id] ?? 2; p.tu = nowMs(); p.doneDate = t; newly.push(it.id); }
    const d = logRead(t, it.id, before);
    if (d > 0) delta[it.id] = d;
  });
  afterSectionsDone(newly, t);
  addLog(t, sh.minutes, sh.tr, '', delta);
  state.meta.lastMinutes[sh.tr] = sh.minutes;
  save(); closeSheet(); render();
  const chDone = [...new Set(newly.map(id => SEC[id].ch))].filter(chapterDone);
  toast(chDone.length ? `${chDone.join('・')}章を読み終えました。明日から復習が入ります` : '記録しました');
}

function openReschedule() {
  const t = today(), s = state.settings, lastDay = addDays(s.phase2Start, -1);
  if (t > lastDay) { toast('教本1周の期間（〜1/4）を過ぎているため、組み直しはできません'); return; }
  const eff = effectiveWeights();
  const L2 = buildLayout(s, eff.w);
  const op = origPace(L2);
  const to0 = s.targetDate >= t ? s.targetDate : lastDay;
  const calc = to => ['main', 'sub'].map(tr => {
    const list = L2.track[tr].list;
    const remU = L2.track[tr].total - list.reduce((a, x) => a + readPages(x.id) * x.w, 0);
    const remP = list.reduce((a, x) => a + layout.secs[x.id].len - readPages(x.id), 0);
    const N = planDays(t, to, s.adjustWeekday).length;
    return {tr, remP, N, ratio:N ? (remU / N) / op.origAvg[tr] : Infinity, dailyP:N ? remP / N : remP, origP:op.origAvgPages[tr]};
  });
  const over = rows => rows.some(r => r.remP > 0 && r.ratio > 1.3);
  // メインが当初の85%以下のペースで済む＝先行している。サブは少量なので1.3倍までは許す
  const under = rows => rows[0].remP > 0 && rows[0].ratio <= 0.85 && rows.every(r => r.remP <= 0 || r.ratio <= 1.3);
  let ext = null, early = null, lighter = false;
  if (over(calc(to0))) {
    for (let d = addDays(to0, 1); d <= lastDay; d = addDays(d, 1)) if (!over(calc(d))) { ext = d; break; }
    if (!ext && to0 < lastDay) ext = lastDay;
  } else if (under(calc(to0))) {
    lighter = true;
    for (let d = t; d < to0; d = addDays(d, 1)) if (calc(d).every(r => r.remP <= 0 || r.ratio <= 1.15)) { early = d; break; }
  }
  const rowsHTML = to => calc(to).map(r => `<div class="kv"><span>${TRACKS[r.tr].name}</span><span>残り${pagesText(r.remP)}・1日平均 約${pagesText(r.dailyP)}<span class="muted">（当初 ${pagesText(r.origP)}）</span></span></div>`).join('');
  const changed = CHAPTERS.filter(c => Math.abs(eff.w[c.no] / eff.prior[c.no] - 1) >= 0.08 && c.sections.some((_, i) => !isDone(`${c.no}.${i + 1}`)));
  const wNote = changed.length ? `<div class="sec"><div class="lbl">実績で補正した重さ（まだ読んでいない章）</div>${changed.map(c => `<div class="kv"><span>${c.no}章 ${esc(c.title)}</span><span>${LEVEL_LABEL[s.chapterLevel[c.no]]} ${eff.prior[c.no].toFixed(1)} → ${eff.w[c.no].toFixed(2)}<span class="muted">（${eff.w[c.no] < eff.prior[c.no] ? '軽く' : '重く'}）</span></span></div>`).join('')}</div>`
    : `<p class="small muted" style="margin:10px 0 0">章ごとの重さ（${eff.k ? '実績で補正済み' : '目安のまま。勉強時間の記録がたまると補正します'}）で割り振ります。</p>`;
  ui.sheet = {kind:'reschedule'};
  openSheet(`<h3>計画を組み直す</h3><p class="lead">まだ読んでいない分を、今日から目標日までの日に割り直します。調整日は含めません。</p>
    <div class="sec"><div class="lbl">目標日 ${jpDate(to0)} のまま</div>${rowsHTML(to0)}</div>
    ${ext ? `<div class="sec"><div class="lbl">目標日を ${jpDate(ext)} に延ばした場合</div>${rowsHTML(ext)}<p class="small muted" style="margin:6px 0 0">目標日のままだと、1日の量が当初の1.3倍を超えます。</p></div>` : ''}
    ${early ? `<div class="sec"><div class="lbl">目標日を ${jpDate(early)} に早めた場合（当初とほぼ同じペース）</div>${rowsHTML(early)}<p class="small muted" style="margin:6px 0 0">早めに読み終えると、その分を過去問に回せます。</p></div>` : ''}
    ${wNote}
    <div class="btns" style="flex-direction:column">${ext ? `<button class="btn primary" data-action="rs-apply" data-to="${ext}">目標日を${md(ext)}に延ばして組み直す</button>` : ''}
    ${early ? `<button class="btn primary" data-action="rs-apply" data-to="${early}">目標日を${md(early)}に早めて組み直す</button>` : ''}
    <button class="btn ${ext || early ? '' : 'primary'}" data-action="rs-apply" data-to="${to0}">目標日${md(to0)}のまま${lighter ? '1日の量を軽くする' : '組み直す'}</button>
    <button class="btn ghost" data-action="close">やめる</button></div>`);
}
function applyReschedule(to) {
  const t = today(), s = state.settings;
  layout = buildLayout(s, effectiveWeights().w);
  const p = makePlan(t, to, {main:trackDone('main'), sub:trackDone('sub')});
  Object.assign(p, origPace());
  state.plan = p;
  s.targetDate = to; s._t = nowMs();
  save(); closeSheet(); render();
  toast(`${md(to)}までの計画に組み直しました`);
}
function openAddLog() {
  ui.sheet = {kind:'log'};
  openSheet(`<h3>時間を記録</h3><p class="lead">今日のタスク以外に勉強した時間を足します。</p>
    <label class="f"><span>日付</span><input type="date" id="lg-date" value="${today()}"></label>
    <label class="f"><span>区分</span><select id="lg-cat">${Object.entries(CAT_LABEL).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
    <div class="sec" style="margin-top:0"><div class="lbl">時間</div>${stepper('lg-min', 30, 10, '分', 0, 600)}</div>
    <label class="f" style="margin-top:12px"><span>メモ（任意）</span><input type="text" id="lg-note"></label>
    <div class="btns"><button class="btn ghost" data-action="close">やめる</button><button class="btn primary" data-action="lg-save">記録する</button></div>`);
}
function openAddExam(kind) {
  ui.sheet = {kind:'exam', ek:kind};
  examSheet();
}
function examSheet() {
  const k = ui.sheet.ek;
  const body = k === 'am'
    ? `<div class="grid2"><label class="f"><span>正解数</span><input type="number" inputmode="numeric" id="ex-correct" placeholder="例 54"></label><label class="f"><span>問題数</span><input type="number" inputmode="numeric" id="ex-total" value="80"></label></div>`
    : `<label class="f"><span>分野</span><select id="ex-field">${PM_FIELDS.map(f => `<option>${f}</option>`).join('')}</select></label>
       <label class="f"><span>得点（自己採点、%）</span><input type="number" inputmode="numeric" id="ex-pct" placeholder="例 65"></label>`;
  const html = `<h3>過去問の結果を記録</h3>
    <div class="seg" style="margin:8px 0 14px"><button class="${k === 'am' ? 'on' : ''}" data-action="ex-kind" data-v="am">午前</button><button class="${k === 'pm' ? 'on' : ''}" data-action="ex-kind" data-v="pm">午後</button></div>
    <div class="grid2"><label class="f"><span>実施回</span><input type="text" id="ex-session" placeholder="例 令和7年秋"></label><label class="f"><span>解いた日</span><input type="date" id="ex-date" value="${today()}"></label></div>
    ${body}
    <div class="sec" style="margin-top:0"><div class="lbl">かかった時間（学習時間にも足します）</div>${stepper('ex-min', k === 'am' ? 150 : 30, 10, '分', 0, 600)}</div>
    <div class="btns"><button class="btn ghost" data-action="close">やめる</button><button class="btn primary" data-action="ex-save">記録する</button></div>`;
  if ($('#sheet').classList.contains('show')) refreshSheet(html); else openSheet(html);
}
function saveExam() {
  const k = ui.sheet.ek, date = $('#ex-date').value || today(), session = $('#ex-session').value.trim(), minutes = Number($('#ex-min').value) || 0;
  const e = {id:uid(), kind:k, session, date, minutes};
  if (k === 'am') {
    const c = Number($('#ex-correct').value), tt = Number($('#ex-total').value);
    if (!(tt > 0) || !(c >= 0) || c > tt || $('#ex-correct').value === '') { toast('正解数と問題数を確かめてください'); return; }
    e.correct = c; e.total = tt;
  } else {
    const p = Number($('#ex-pct').value);
    if ($('#ex-pct').value === '' || !(p >= 0 && p <= 100)) { toast('得点を0〜100で入れてください'); return; }
    e.pct = Math.round(p); e.field = $('#ex-field').value;
  }
  state.exams.push(e);
  addLog(date, minutes, k, session);
  save(); closeSheet(); render(); toast('記録しました');
}
function confirmSheet(title, lead, okLabel, okAction, danger = false, data = '') {
  ui.sheet = {kind:'confirm'};
  openSheet(`<h3>${title}</h3><p class="lead">${lead}</p><div class="btns"><button class="btn ghost" data-action="close">やめる</button><button class="btn ${danger ? 'danger' : 'primary'}" data-action="${okAction}" ${data}>${okLabel}</button></div>`);
}

/* ========== 書き出し・読み込み ========== */
async function exportData() {
  const t = today(), now = new Date().toISOString();
  // 書き出したファイル自体にも「書き出した日」を入れておく（読み込み後に促しが出続けないように）
  const json = JSON.stringify({...state, meta:{...state.meta, lastExport:now}, app:'ap-study', exportedAt:now}, null, 2);
  const name = `ap-study-${t}.json`;
  const mark = () => { state.meta.lastExport = now; save(); render(); };
  let file = null;
  try { file = new File([json], name, {type:'application/json'}); } catch (e) { file = null; }
  if (file && navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:name}); mark(); toast('書き出しました'); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 8000);
  mark(); toast('書き出しました');
}
let pendingImport = null;
function handleImportFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const obj = JSON.parse(rd.result);
      if (!obj || !obj.progress || !obj.settings) throw new Error('bad');
      pendingImport = obj;
      const n = Object.values(obj.progress).filter(p => p && p.frac >= 1).length;
      confirmSheet('データを読み込む', `${obj.exportedAt ? `${jpDate(obj.exportedAt.slice(0, 10))}に書き出したデータ（読了${n}節）です。` : ''}今のデータはすべて置き換わります。${syncCfg ? '同期しているほかの端末にも、この内容が反映されます。' : ''}`, '読み込む', 'import-ok', true);
    } catch (e) { toast('このファイルは読み込めませんでした'); }
  };
  rd.readAsText(file);
}

/* ========== 操作 ========== */
const actions = {
  tab:el => { ui.tab = el.dataset.tab; closeSheet(); render(); window.scrollTo(0, 0); },
  close:() => closeSheet(),
  step:el => {
    const inp = document.getElementById(el.dataset.for);
    const v = clamp((Number(inp.value) || 0) + Number(el.dataset.d), Number(el.dataset.min), Number(el.dataset.max));
    inp.value = v;
  },
  'goto-pages':(el, e) => { e.preventDefault(); ui.tab = 'settings'; render(); setTimeout(() => { const c = $('#pages-card'); if (c) c.scrollIntoView({block:'start'}); }, 30); },
  complete:el => openComplete(el.dataset.track, el.dataset.mode),
  'cs-partial':el => { ui.sheet.minutes = Number($('#cs-min').value) || 0; ui.sheet.partial = el.dataset.v === '1'; refreshSheet(completeHTML()); },
  'cs-check':el => { ui.sheet.minutes = Number($('#cs-min').value) || 0; ui.sheet.checks[Number(el.dataset.i)] = el.checked; refreshSheet(completeHTML()); },
  'cs-u':el => { ui.sheet.minutes = Number($('#cs-min').value) || 0; ui.sheet.u[el.dataset.id] = Number(el.dataset.v); const pg = $('#cs-page'); if (pg) ui.sheet.page = pg.value === '' ? null : Number(pg.value); refreshSheet(completeHTML()); },
  'cs-save':() => saveComplete(),
  review:el => openReview(el.dataset.id),
  'rv-save':() => saveReview(),
  'toggle-ch':el => { const n = Number(el.dataset.ch); if (ui.open.has(n)) ui.open.delete(n); else ui.open.add(n); if (!ui.open.size) ui.open.add(-1); render(); },
  'open-sec':el => openSection(el.dataset.id),
  'sec-u':el => {
    const id = ui.sheet.id, p = prog(id), v = Number(el.dataset.v);
    if (isDone(id)) { p.u = v; p.tu = nowMs(); if (v === 1) ensureReread(id, today()); save(); render(); refreshSheet(sectionHTML()); toast('理解度を変えました'); }
    else { p.u = v; p.tu = nowMs(); refreshSheet(sectionHTML()); }
  },
  'sec-done':() => {
    const id = ui.sheet.id, p = prog(id), t = today(), before = readPages(id);
    p.frac = 1; p.u = p.u ?? 2; p.doneDate = t; p.tf = p.tu = nowMs();
    logRead(t, id, before);
    afterSectionsDone([id], t);
    save(); render(); refreshSheet(sectionHTML()); toast('読了にしました');
  },
  'sec-unread':() => { const id = ui.sheet.id, p = prog(id), before = readPages(id); p.frac = 0; p.u = null; p.doneDate = null; p.tf = p.tu = nowMs(); logRead(today(), id, before); save(); render(); refreshSheet(sectionHTML()); toast('未読に戻しました'); },
  'sec-memo':() => { const p = prog(ui.sheet.id); p.memo = $('#sec-memo').value; p.tm = nowMs(); save(); render(); closeSheet(); toast('メモを保存しました'); },
  reschedule:() => openReschedule(),
  'rs-apply':el => applyReschedule(el.dataset.to),
  'rebuild-baseline':() => confirmSheet('開始日から作り直す', '開始日と目標日はそのままで、最初の計画を作り直します。読んだ記録は残ります。', '作り直す', 'rebuild-baseline-ok'),
  'rebuild-baseline-ok':() => { rebuildPlan('baseline'); save(); closeSheet(); render(); toast('計画を作り直しました'); },
  'add-log':() => openAddLog(),
  'lg-save':() => {
    const m = Number($('#lg-min').value) || 0;
    if (m <= 0) { toast('時間を入れてください'); return; }
    addLog($('#lg-date').value || today(), m, $('#lg-cat').value, $('#lg-note').value.trim());
    save(); closeSheet(); render(); toast('記録しました');
  },
  'del-log':el => confirmSheet('記録を消す', 'この学習時間の記録を消します。', '消す', 'del-log-ok', true, `data-id="${el.dataset.id}"`),
  'del-log-ok':el => { state.logs = state.logs.filter(l => l.id !== el.dataset.id); state.deleted.logs.push(el.dataset.id); save(); closeSheet(); render(); },
  'add-exam':el => openAddExam(el.dataset.kind),
  'ex-kind':el => { ui.sheet.ek = el.dataset.v; examSheet(); },
  'ex-save':() => saveExam(),
  'del-exam':el => confirmSheet('結果を消す', 'この過去問の結果を消します（学習時間の記録は残ります）。', '消す', 'del-exam-ok', true, `data-id="${el.dataset.id}"`),
  'del-exam-ok':el => { state.exams = state.exams.filter(x => x.id !== el.dataset.id); state.deleted.exams.push(el.dataset.id); save(); closeSheet(); render(); },
  'mark-applied':() => { state.settings.applied = today(); state.settings._t = nowMs(); save(); render(); toast('受験日を予約したら、設定で日付を直してください', 3500); },
  'save-dates':() => {
    const r = readDatesForm('d_');
    if (!r.ok) { $('#d_err').innerHTML = `<div class="err">${r.error}</div>`; return; }
    const s = state.settings;
    const planChanged = r.startDate !== s.startDate || r.targetDate !== s.targetDate || r.adjustWeekday !== s.adjustWeekday;
    if (r.targetDate !== s.targetDate) s.baseTargetDate = r.targetDate;
    Object.assign(s, {startDate:r.startDate, targetDate:r.targetDate, examA:r.examA, examB:r.examB, examConfirmed:r.examConfirmed, adjustWeekday:r.adjustWeekday, goalWeekday:r.goalWeekday, goalHoliday:r.goalHoliday});
    s._t = nowMs();
    if (planChanged) rebuildPlan('fromToday');
    save(); render(); toast(planChanged ? '保存して計画を組み直しました' : '保存しました');
  },
  'save-pages':() => {
    const r = readPagesForm('p_');
    if (!r.ok) { $('#p_err').innerHTML = `<div class="err">${r.error}</div>`; return; }
    Object.assign(state.settings, {chapterStart:r.chapterStart, bodyEnd:r.bodyEnd, sectionStart:r.sectionStart, _t:nowMs()});
    rebuildPlan('baseline');
    save(); render(); toast(r.empty ? 'ページ未設定（節の数で計画）にしました' : 'ページを保存して計画を作り直しました');
  },
  'save-weights':() => {
    CHAPTERS.forEach(c => { const el = document.getElementById(`w_${c.no}`); if (el) state.settings.chapterLevel[c.no] = el.value; });
    state.settings._t = nowMs();
    rebuildPlan('fromToday');
    save(); render(); toast('重さを保存して、今日から組み直しました');
  },
  'sync-connect':() => connectSync('sy_', false),
  'sync-now':async () => { await syncNow(); toast(syncUI.status === 'ok' ? '同期しました' : (syncUI.msg || '同期できませんでした'), 3000); },
  'sync-disconnect':() => confirmSheet('この端末の同期をやめる', 'この端末に入っている記録は残ります。GitHubのデータもそのまま残るので、あとで接続し直せます。', '同期をやめる', 'sync-disconnect-ok'),
  'sync-disconnect-ok':() => { syncCfg = null; kvSet('sync', null); setSyncStatus('idle'); closeSheet(); render(); toast('この端末の同期をやめました'); },
  'goto-sync':() => { ui.tab = 'settings'; closeSheet(); render(); setTimeout(() => { const c = $('#sync-card'); if (c) c.scrollIntoView({block:'start'}); }, 30); },
  'setup-sync':() => { ui.setupStep = 'sync'; render(); window.scrollTo(0, 0); },
  'setup-sync-back':() => { ui.setupStep = 1; render(); window.scrollTo(0, 0); },
  'setup-sync-connect':() => connectSync('ws_', true),
  export:() => exportData(),
  import:() => { const f = $('#importFile'); f.value = ''; f.click(); },
  'import-ok':() => {
    if (!pendingImport) return;
    state = normalize(pendingImport); state.meta.setupDone = true; pendingImport = null;
    refreshLayout(); if (!state.plan || !state.plan.weights) rebuildPlan(anyProgress() ? 'fromToday' : 'baseline');
    if (syncCfg) {
      // 読み込んだ内容をほかの端末にも行き渡らせる（時刻を今にして、同期では上書きで送る）
      const tnow = nowMs();
      Object.values(state.progress).forEach(p => { p.tf = p.tu = p.tm = tnow; });
      state.settings._t = tnow; state.reviews.forEach(r => { r._t = tnow; });
      if (state.plan) state.plan.createdAt = new Date().toISOString();
      syncCfg.force = true; kvSet('sync', syncCfg);
    }
    save(); closeSheet(); ui.tab = 'today'; render(); toast('読み込みました');
  },
  reset:() => confirmSheet('すべてのデータを消す', `この端末の、読んだ記録・学習時間・過去問・設定がすべて消えます。先に書き出しておくことをおすすめします。${syncCfg ? 'この端末の同期設定も外れます（GitHubのデータは残るので、接続し直せば戻せます）。' : ''}`, 'すべて消す', 'reset-ok', true),
  'reset-ok':() => { if (syncCfg) { syncCfg = null; kvSet('sync', null); } state = freshState(); ui.setupStep = 1; ui.tab = 'today'; refreshLayout(); save(); closeSheet(); render(); },
  'setup-next':() => { ui.setupStep = 2; render(); window.scrollTo(0, 0); },
  'setup-back':() => { ui.setupStep = 2; render(); window.scrollTo(0, 0); },
  'setup-pages':() => {
    const r = readPagesForm('s_');
    if (!r.ok) { $('#s_err').innerHTML = `<div class="err">${r.error}</div>`; return; }
    if (r.empty) { $('#s_err').innerHTML = '<div class="err">ページを入れるか、下の「あとで入れる」を選んでください。</div>'; return; }
    Object.assign(state.settings, {chapterStart:r.chapterStart, bodyEnd:r.bodyEnd, sectionStart:r.sectionStart});
    ui.setupStep = 3; render(); window.scrollTo(0, 0);
  },
  'setup-skip-pages':() => { ui.setupStep = 3; render(); window.scrollTo(0, 0); },
  'setup-finish':() => {
    const r = readDatesForm('s_');
    if (!r.ok) { $('#s_err2').innerHTML = `<div class="err">${r.error}</div>`; return; }
    Object.assign(state.settings, {startDate:r.startDate, targetDate:r.targetDate, baseTargetDate:r.targetDate, examA:r.examA, examB:r.examB, examConfirmed:r.examConfirmed, adjustWeekday:r.adjustWeekday, goalWeekday:r.goalWeekday, goalHoliday:r.goalHoliday});
    state.settings._t = nowMs();
    rebuildPlan('baseline');
    state.meta.setupDone = true;
    requestPersist();
    save(); ui.tab = 'today'; render(); window.scrollTo(0, 0);
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el, e);
});
document.addEventListener('input', e => {
  if (e.target.id === 'cs-page' && ui.sheet && ui.sheet.kind === 'complete') {
    const v = e.target.value.trim();
    const before = willComplete().join();
    ui.sheet.page = v === '' ? null : Number(v);
    if (willComplete().join() !== before) {
      ui.sheet.minutes = Number($('#cs-min').value) || 0;
      const pos = e.target.selectionStart;
      refreshSheet(completeHTML());
      const inp = $('#cs-page'); inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (err) { /* number input */ }
    }
  }
});
$('#backdrop').addEventListener('click', closeSheet);
$('#importFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) handleImportFile(f); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (!inputFocused()) render();
  if (syncCfg && nowMs() - syncUI.lastAttempt > 15000) syncNow();
});
window.addEventListener('online', () => { if (syncCfg) syncNow(); });
document.addEventListener('focusout', () => setTimeout(() => { if (syncUI.needRender && !ui.sheet && !inputFocused()) { syncUI.needRender = false; render(); } }, 400));
setInterval(() => { if (syncCfg && document.visibilityState === 'visible') syncNow(); }, 120000);

function requestPersist() {
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().then(v => { state.meta.persisted = v; save(); }).catch(() => {});
  }
}

/* ========== 起動 ========== */
(async function init() {
  const loaded = await loadState();
  state = loaded ? normalize(loaded) : freshState();
  if (!loaded && today() > state.settings.startDate && today() < state.settings.targetDate) state.settings.startDate = today();
  refreshLayout();
  if (state.meta.setupDone && (!state.plan || !state.plan.weights)) rebuildPlan(state.plan && anyProgress() ? 'fromToday' : 'baseline');
  syncCfg = await kvGet('sync');
  render();
  if (syncCfg) syncNow();
  if (state.meta.setupDone && navigator.storage && navigator.storage.persisted) {
    navigator.storage.persisted().then(v => { if (v !== state.meta.persisted) { state.meta.persisted = v; save(); if (ui.tab === 'settings') render(); } }).catch(() => {});
  }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
